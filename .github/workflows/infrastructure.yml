name: Infrastructure

on:
  pull_request:

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@ac0cb9395b18acdfb412d3e751b69a232733048b

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    with:
      root: terraform
      vars-file: environments/uk-west.tfvars
      preview-lock-file: terraform/opentofu.lock.hcl

    secrets: inherit
