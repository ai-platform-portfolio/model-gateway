name: Infrastructure

on:
  pull_request:

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@fa3c344c811dc878a98d526c71030a4860643ac1

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    with:
      root: terraform
      vars-file: environments/uk-south.tfvars
      preview-lock-file: terraform/opentofu.lock.hcl

    secrets: inherit
