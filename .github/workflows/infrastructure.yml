name: Infrastructure

on:
  pull_request:

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@11f64d16ebc665116197157ebf8a7e118f5f7a6f

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    with:
      root: terraform
      vars-file: environments/uk-west.tfvars
      preview-lock-file: terraform/opentofu.lock.hcl

    secrets: inherit
