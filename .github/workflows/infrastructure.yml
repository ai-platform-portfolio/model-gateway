name: Infrastructure

on:
  pull_request:

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@d41e899d7d8f03ea9c6a1ac32eba7f7c34db7d00

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    with:
      root: terraform
      vars-file: environments/uk-west.tfvars
      preview-lock-file: terraform/opentofu.lock.hcl

    secrets: inherit
