name: Infrastructure

on:
  pull_request:

  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/federation.json'
      - '.github/workflows/infrastructure.yml'

  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or plan and request deployment approval
        type: choice
        options: [plan-only, deploy]
        default: plan-only

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infrastructure:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@6d07576502ab6c6f2aed196940d02b8e726abad8

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    with:
      operation: ${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy') }}
      engine: terraform
      version: '1.12.2'
      root: terraform
      backend-file: backend.hcl
      vars-file: environments/uk-south.tfvars
      lock-file: ''
      federation-file: .github/federation.json
      plan-environment: central-plan
      apply-environment: central-apply
      approver: michaelalinks
      state-lock: model-gateway-uk-south

    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_RESOURCE_NAME: ${{ secrets.TF_BACKEND_RESOURCE_NAME }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
