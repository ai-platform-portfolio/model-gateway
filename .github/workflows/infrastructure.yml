name: Infrastructure

on:
  pull_request:

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@9d552595eab933e86127e562fcb2caef4a0a8eeb

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    with:
      root: terraform
      vars-file: environments/uk-west.tfvars
      preview-lock-file: terraform/opentofu.lock.hcl
      aws-region: eu-west-2
      google-auth: true

    secrets: inherit
