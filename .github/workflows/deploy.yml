name: Deploy infrastructure
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/federation.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, or plan and request deployment approval
        type: choice
        options: [plan-only, deploy]
        default: plan-only
permissions:
  contents: read
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    uses: ai-platform-portfolio/ops-shared/.github/workflows/terraform.yml@e231e2fad78504d141e0e00d6a5a6f480341d2cd
    permissions:
      contents: read
      id-token: write
    with:
      operation: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
      engine: terraform
      version: '1.12.2'
      root: terraform
      backend-file: backend.hcl
      vars-file: environments/uk-south.tfvars
      federation-file: .github/federation.json
      plan-environment: central-plan
      apply-environment: central-apply
      approver: michaelalinks
      state-lock: model-gateway-uk-south
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ secrets.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_RESOURCE_NAME: ${{ secrets.TF_BACKEND_RESOURCE_NAME }}
      TF_BACKEND_CONTAINER: ${{ secrets.TF_BACKEND_CONTAINER }}
